<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Purple Website</title>

    <style>
        body{
            margin:0;
            overflow:hidden;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right, #141e30, #6a11cb);
            height:100vh;
            text-align:center;
        }

        h1{
            margin-top:100px;
            font-size:60px;
            color:white;
            text-shadow:0 0 20px #8e2de2;
        }

        p{
            color:#dcd6ff;
            font-size:22px;
        }

        button{
            margin-top:20px;
            padding:15px 35px;
            border:none;
            border-radius:20px;
            font-size:20px;
            cursor:pointer;
            color:white;
            background:linear-gradient(to right, #4facfe, #8e2de2);
            box-shadow:0 0 25px rgba(142,45,226,0.8);
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.1);
            box-shadow:0 0 35px rgba(79,172,254,1);
        }

        .item{
            position:absolute;
            font-size:35px;
            animation:fall linear forwards;
        }

        @keyframes fall{
            0%{
                transform:translateY(-50px) rotate(0deg);
                opacity:1;
            }

            100%{
                transform:translateY(100vh) rotate(720deg);
                opacity:0;
            }
        }
    </style>
</head>
<body>

    <h1>Welcome Rizky al azhar</h1>
    <p>Blue & Purple Fantasy Theme ✨</p>

    <button onclick="magic()">Klik Saya</button>

    <script>

        function magic(){

            let items = ["🌸","💙","🍃","⭐","🦋","✨"];

            for(let i = 0; i < 40; i++){

                let element = document.createElement("div");

                element.classList.add("item");

                element.innerHTML =
                items[Math.floor(Math.random()*items.length)];

                element.style.left =
                Math.random() * window.innerWidth + "px";

                element.style.animationDuration =
                (Math.random() * 3 + 2) + "s";

                element.style.fontSize =
                (Math.random() * 25 + 20) + "px";

                document.body.appendChild(element);

                setTimeout(() => {
                    element.remove();
                },5000);
            }
        }

    </script>

</body>
</html>
